<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-форум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #1e1e2f, #2a1e4a, #1e2f4a, #1e2f2f);
    background-size: 400% 400%;
    animation: gradient 20s ease infinite;
    min-height: 100vh;
    padding: 30px 20px;
    color: #e8e8f0;
  }

  @keyframes gradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #a78bfa, #22d3ee, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  header p { opacity: 0.6; font-size: 0.95rem; }

  /* Форма создания темы */
  .new-post {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, textarea {
    width: 100%;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    color: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border 0.25s, box-shadow 0.25s;
    resize: vertical;
  }

  input:focus, textarea:focus {
    border-color: #a78bfa;
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
  }

  textarea { min-height: 80px; }

  .btn {
    padding: 11px 24px;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    align-self: flex-end;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(167, 139, 250, 0.35);
  }
  .btn:active { transform: translateY(0) scale(0.97); }

  /* Тема */
  .topic {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .topic-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .topic-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
  }

  .topic-meta {
    font-size: 0.78rem;
    opacity: 0.5;
    margin-top: 4px;
  }

  .topic-body {
    font-size: 0.95rem;
    line-height: 1.55;
    opacity: 0.9;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e8e8f0;
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-1px);
  }

  .action-btn.liked {
    background: rgba(244, 114, 182, 0.2);
    border-color: rgba(244, 114, 182, 0.5);
    color: #f9a8d4;
  }

  .action-btn.delete:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.5);
    color: #fca5a5;
  }

  /* Комментарии */
  .comments {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: none;
    flex-direction: column;
    gap: 10px;
  }

  .comments.open { display: flex; }

  .comment {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.9rem;
    animation: fadeIn 0.3s ease;
  }

  .comment-author {
    font-weight: 600;
    color: #a78bfa;
    font-size: 0.82rem;
    margin-bottom: 3px;
  }

  .comment-form {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .comment-form input {
    flex: 1;
    padding: 9px 14px;
    font-size: 0.88rem;
  }

  .comment-form button {
    padding: 9px 18px;
    background: linear-gradient(135deg, #22d3ee, #a78bfa);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: transform 0.2s;
  }

  .comment-form button:hover { transform: scale(1.05); }

  .empty {
    text-align: center;
    padding: 50px 20px;
    opacity: 0.5;
    font-size: 1rem;
  }

  .empty span { font-size: 3rem; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💬 Мини-форум</h1>
      <p>Создавай темы, отвечай, лайкай</p>
    </header>

    <div class="new-post">
      <input type="text" id="authorInput" placeholder="Твоё имя" maxlength="30">
      <input type="text" id="titleInput" placeholder="Заголовок темы" maxlength="80">
      <textarea id="bodyInput" placeholder="О чём хочешь поговорить?" maxlength="500"></textarea>
      <button class="btn" onclick="createTopic()">Опубликовать</button>
    </div>

    <div id="topics"></div>
  </div>

<script>
  // ===== Состояние =====
  let topics = JSON.parse(localStorage.getItem('forum_topics') || '[]');
  let currentUser = 'Аноним';

  // ===== Сохранение =====
  function save() {
    localStorage.setItem('forum_topics', JSON.stringify(topics));
  }

  // ===== Утилиты =====
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'только что';
    if (s < 3600) return Math.floor(s / 60) + ' мин назад';
    if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
    return Math.floor(s / 86400) + ' дн назад';
  }

  // ===== Создание темы =====
  function createTopic() {
    const author = document.getElementById('authorInput').value.trim() || 'Аноним';
    const title = document.getElementById('titleInput').value.trim();
    const body = document.getElementById('bodyInput').value.trim();

    if (!title) return alert('Введи заголовок!');
    if (!body) return alert('Напиши текст темы!');

    topics.unshift({
      id: Date.now(),
      author,
      title,
      body,
      time: Date.now(),
      likes: 0,
      liked: false,
      comments: []
    });

    document.getElementById('titleInput').value = '';
    document.getElementById('bodyInput').value = '';
    currentUser = author;

    save();
    render();
  }

  // ===== Лайк =====
  function toggleLike(id) {
    const t = topics.find(x => x.id === id);
    if (!t) return;
    t.liked = !t.liked;
    t.likes += t.liked ? 1 : -1;
    save();
    render();
  }

  // ===== Удаление =====
  function deleteTopic(id) {
    if (!confirm('Удалить тему?')) return;
    topics = topics.filter(x => x.id !== id);
    save();
    render();
  }

  // ===== Комментарий =====
  function addComment(id) {
    const t = topics.find(x => x.id === id);
    const input = document.getElementById('comment-input-' + id);
    const text = input.value.trim();
    if (!text) return;

    t.comments.push({
      author: currentUser,
      text,
      time: Date.now()
    });
    input.value = '';
    save();
    render();
  }

  // ===== Показать/скрыть комментарии =====
  function toggleComments(id) {
    const el = document.getElementById('comments-' + id);
    el.classList.toggle('open');
  }

  // ===== Рендер =====
  function render() {
    const container = document.getElementById('topics');

    if (topics.length === 0) {
      container.innerHTML = '<div class="empty"><span>🌌</span>Пока нет тем. Создай первую!</div>';
      return;
    }

    container.innerHTML = topics.map(t => `
      <div class="topic">
        <div class="topic-header">
          <div>
            <div class="topic-title">${escapeHtml(t.title)}</div>
            <div class="topic-meta">${escapeHtml(t.author)} • ${timeAgo(t.time)}</div>
          </div>
        </div>
        <div class="topic-body">${escapeHtml(t.body)}</div>
        <div class="actions">
          <button class="action-btn ${t.liked ? 'liked' : ''}" onclick="toggleLike(${t.id})">
            ${t.liked ? '❤️' : '🤍'} ${t.likes}
          </button>
          <button class="action-btn" onclick="toggleComments(${t.id})">
            💬 ${t.comments.length}
          </button>
          <button class="action-btn delete" onclick="deleteTopic(${t.id})">
            🗑 Удалить
          </button>
        </div>

        <div class="comments ${t.comments.length ? '' : ''}" id="comments-${t.id}">
          ${t.comments.map(c => `
            <div class="comment">
              <div class="comment-author">${escapeHtml(c.author)} • ${timeAgo(c.time)}</div>
              <div>${escapeHtml(c.text)}</div>
            </div>
          `).join('')}
          <div class="comment-form">
            <input type="text" id="comment-input-${t.id}" placeholder="Написать ответ..." maxlength="300"
              onkeydown="if(event.key==='Enter'){addComment(${t.id})}">
            <button onclick="addComment(${t.id})">→</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Запоминаем имя пользователя
  document.getElementById('authorInput').addEventListener('input', e => {
    currentUser = e.target.value.trim() || 'Аноним';
  });

  // Старт
  render();
</script>
</body>
</html>
