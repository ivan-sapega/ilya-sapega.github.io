<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Самостоятельная работа</title>
</head>
<body>
<h3>Информация о браузере и экране</h3>
<input type="button" value="Показать" onclick="
    alert('Экран: ' + screen.width + 'x' + screen.height +
          '\nБраузер: ' + navigator.appName +
          '\nЯзык: ' + navigator.language);
">
<input type="button" value="Печать" onclick="window.print();">
<input type="button" value="Вниз" onclick="window.scrollTo(0, 500);">
<div style="height:1000px;"></div>
</body>
</html>
