<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Сумма чисел</title>
<script type="text/javascript">
function Sum() {
    // document.имя_формы.имя_поля.value
    let a = parseFloat(document.myForm.num1.value) || 0;
    let b = parseFloat(document.myForm.num2.value) || 0;
    document.myForm.res.value = a + b;
}
</script>
</head>
<body>
<h3>Вычисление суммы</h3>
<form name="myForm">
    Первое число: <input type="text" name="num1"><br><br>
    Второе число: <input type="text" name="num2"><br><br>
    <input type="button" value="Вычислить сумму" onclick="Sum();"><br><br>
    Сумма: <input type="text" name="res" readonly>
</form>
</body>
</html>
