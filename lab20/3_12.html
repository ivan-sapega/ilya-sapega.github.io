<html>
<head>
<title>Универсальные свойства и методы</title>
<script type="text/javascript">
function f1() {
    let allDiv = document.getElementsByTagName('div');
    for (let i = 0; i < allDiv.length; i++) {
        allDiv[i].removeAttribute('style');
    }
    document.all[2].innerText = "Общие свойства и методы";
    document.getElementsByTagName('input')[0].setAttribute('value', 'Уже изменили', false);
}
</script>
</head>
<body>
<div style="color: aqua;">Универсальные</div>
<div style="color: lime;">Свойства и Методы</div>
<div style="color: magenta;">поддерживаются всеми элементами</div>
<input type="button" onClick="f1();" value="Изменить" style="float: right;">
</body>
</html>
