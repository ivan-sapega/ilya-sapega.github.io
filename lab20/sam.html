<html>
<head>
<meta charset="utf-8">
<title>Самостоятельная работа</title>
</head>
<body>
<h3>Универсальные методы</h3>
<div id="d1" class="box">Первый блок</div>
<div id="d2" class="box">Второй блок</div>
<br>
<input type="button" value="Показать родителя" onclick="
    alert(document.getElementById('d1').parentNode.tagName);
">
<input type="button" value="Следующий элемент" onclick="
    alert(document.getElementById('d1').nextSibling.textContent);
">
<input type="button" value="Показать класс" onclick="
    alert(document.getElementById('d1').className);
">
<input type="button" value="Удалить второй" onclick="
    document.getElementById('d2').remove();
">
</body>
</html>
