<html>
<head>
<meta charset="utf-8">
<title>Pointer events</title>
</head>
<body>
<div id="box" style="width:100px; height:100px; background:red;"></div>
<script>
let box = document.getElementById('box');
box.addEventListener('pointerdown', () => box.style.background = 'blue');
box.addEventListener('pointerup',   () => box.style.background = 'red');
</script>
</body>
</html>
