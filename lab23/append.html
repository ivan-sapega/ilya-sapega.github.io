<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Добавление элементов (append)</title>
</head>
<body>
<script>
const header = document.createElement("h1");
const headerText = document.createTextNode("Hello World");
header.appendChild(headerText);
document.body.appendChild(header);
</script>
</body>
</html>
