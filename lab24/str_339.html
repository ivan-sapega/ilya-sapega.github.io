<html>
<head>
<meta charset="utf-8">
<title>fieldset, legend, label</title>
</head>
<body>
<form>
    <fieldset><legend align="right">ССО</legend>
        <label>Код специальности: </label>
        <input placeholder="2-40 01 01">
        <label>Название специальности: </label>
        <input required>
    </fieldset>
    <input type="button" value="Изменить" onClick="f1();">
</form>
<script>
function f1() {
    alert(document.forms[0].elements[0].type); // fieldset
    alert(document.forms[0].elements[1].outerHTML);
    document.getElementsByTagName('legend')[0].innerText =
        "Среднее специальное образование";
}
</script>
</body>
</html>
