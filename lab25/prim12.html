<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Пример 12</title></head>
<body>
<script>
let regexp = /^.+\.(png|jpg|jpeg)$/i;
alert(regexp.test("photo.png"));   // true
alert(regexp.test("image.JPG"));   // true
alert(regexp.test("picture.gif")); // false
</script>
</body>
</html>
