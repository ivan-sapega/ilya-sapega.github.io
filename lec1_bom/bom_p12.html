<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Пример 12</title>
<script>
function func1() { alert('Ширина — ' + screen.width); }
function func2() { alert('Высота — ' + screen.height); }
function func3() { alert('Глубина цвета — ' + screen.colorDepth); }
</script>
</head>
<body>
<form>
    <input type="button" value="Первая" onclick="func1()">
    <input type="button" value="Вторая" onclick="func2()">
    <input type="button" value="Третья" onclick="func3()">
</form>
</body>
</html>
