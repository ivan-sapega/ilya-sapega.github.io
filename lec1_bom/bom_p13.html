<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Пример 13</title>
<script>
function func1(e) { e = e || event; alert(e.type); }
</script>
</head>
<body onmousedown="func1(event)" onkeypress="func1(event)">
<form>
    <input type="button" value="Первая">
    <input type="button" value="Вторая" onmouseover="func1(event)">
    <input type="button" value="Третья">
</form>
</body>
</html>
