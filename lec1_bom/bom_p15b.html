<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>screenX/screenY</title>
<script>
function func1(e) { e = e || event; document.title = "(" + e.screenX + ", " + e.screenY + ")"; }
</script>
</head>
<body onmousedown="func1(event)">
<p>Щёлкни — координаты на мониторе в заголовке вкладки.</p>
</body>
</html>
