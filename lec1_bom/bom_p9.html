<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Пример 9</title>
<script>
function func1() { let m = prompt('Введите свое имя',''); alert(m); }
function func2() { let n = confirm('Нажмите на любую кнопку'); alert(n); }
function func3() { alert('Вы нажали третью кнопку'); }
</script>
</head>
<body>
<form>
    <input type="button" value="Первая" onclick="func1()">
    <input type="button" value="Вторая" onclick="func2()">
    <input type="button" value="Третья" onclick="func3()">
</form>
</body>
</html>
