<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Регулярное выражение 4</title>
</head>
<body>
<script>
//  
var reg2 = /\d+/g;

// Строка с числами
var s1 = "ID = 123 #23 abc345def";

document.writeln(s1 + "<br>");
document.writeln(s1.match(reg2));
</script>
</body>
</html>
