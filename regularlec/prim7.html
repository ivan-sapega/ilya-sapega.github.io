<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Проверка даты</title>
<script>
function check() {
    var s = document.getElementById("inp").value;
    // Год: 19XX ИЛИ 200X ИЛИ 201[0-4]
    // Месяц: 01-09 ИЛИ 10-12
    // День: 01-09 ИЛИ 10-29 ИЛИ 30-31
    var reg = /^(19\d\d|200\d|201[0-4])-(0[1-9]|1[0-2])-(0[1-9]|[1-2]\d|3[0-1])$/;
    alert(reg.test(s) ? "Верно" : "Неверно");
}
function clear_() { document.getElementById("inp").value = ""; }
</script>
</head>
<body>
<input id="inp" type="text" placeholder="2024-03-15" size="20">
<input type="button" value="Проверить" onclick="check()">
<input type="button" value="Очистить" onclick="clear_()">
</body>
</html>
